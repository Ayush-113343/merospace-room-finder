<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login — MeroSpace</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">
  <div class="admin-login-card">
    <div class="admin-login-logo">
      <h2>🔐 MeroSpace Admin</h2>
      <p>Sign in to access the control panel</p>
    </div>
    <form id="adminLoginForm">
      <input type="email" id="email" placeholder="admin@merospace.com" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <p id="error"></p>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:.82rem;color:var(--ink-soft)">
      <a href="/" style="color:var(--primary)">← Back to website</a>
    </p>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
