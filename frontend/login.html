<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — MeroSpace</title>
  <meta name="description" content="Sign in to your MeroSpace account to manage listings and saved rooms.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="navbar">
    <a href="/" class="nav-logo">Mero<span>Space</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/rooms">Explore</a></li>
      <li><a href="/register" style="margin-left:6px" class="btn btn-primary btn-sm">Sign up free</a></li>
    </ul>
  </nav>
</header>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" class="nav-logo" style="font-size:1.6rem;">Mero<span>Space</span></a>
      <h2>Welcome back</h2>
      <p>Sign in to your account</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:4px;">
        Log In
      </button>
      <p class="form-message" id="message" role="alert"></p>
    </form>

    <p class="form-footer-link">Don't have an account? <a href="/register">Create one free →</a></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/script.js"></script>
<script>
  document.getElementById('navToggle')?.addEventListener('click', () => {
    document.getElementById('navLinks')?.classList.toggle('open');
  });
</script>
</body>
</html>
