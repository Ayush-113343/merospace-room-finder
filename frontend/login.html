<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MeroSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="navbar">
    <a href="/" class="nav-logo">Mero<span>Space</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/rooms">Rooms</a></li>
    </ul>
  </nav>
</header>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h2>Welcome back</h2>
      <p>Sign in to your MeroSpace account</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      <p class="form-message" id="message"></p>
    </form>
    <p class="form-footer-link">Don't have an account? <a href="/register">Register here</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
