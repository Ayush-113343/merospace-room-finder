<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Details — MeroSpace</title>
  <meta name="description" content="View room details, photos, amenities, and contact the landlord on MeroSpace.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── details page extras ── */
    .detail-info-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--sp-3); margin-top: var(--sp-4);
    }
    .detail-info-item {
      background: var(--bg); border-radius: var(--r-md);
      padding: var(--sp-3) var(--sp-4); border: 1px solid var(--bg-3);
    }
    .detail-info-item .label { font-size: 0.68rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
    .detail-info-item .value { font-size: 0.9rem; font-weight: 700; color: var(--ink); }

    /* lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,0.95);
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw; max-height: 88vh;
      object-fit: contain; border-radius: var(--r-lg);
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      background: rgba(255,255,255,0.1); border: none; color: #fff;
      font-size: 1.8rem; cursor: pointer; border-radius: 50%;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--t-fast);
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none; color: #fff;
      font-size: 1.6rem; cursor: pointer;
      width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--t-fast);
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav.prev { left: 20px; }
    .lightbox-nav.next { right: 20px; }

    /* nearby section */
    .nearby-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-3); }
    .nearby-tag {
      display: flex; align-items: center; gap: 5px;
      background: var(--bg-2); border: 1px solid var(--bg-3);
      border-radius: var(--r-full); padding: 4px 12px;
      font-size: 0.78rem; color: var(--ink-3);
    }
    .nearby-tag svg { width: 11px; height: 11px; color: var(--primary); }

    /* share row */
    .share-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: var(--sp-4); padding-top: var(--sp-4);
      border-top: 1px solid var(--bg-3);
    }
    .share-row span { font-size: 0.78rem; color: var(--ink-3); font-weight: 600; }
    .share-btn {
      padding: 7px 14px; border-radius: var(--r-sm);
      font-size: 0.78rem; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--bg-3); background: var(--bg);
      color: var(--ink-2); transition: all var(--t-fast);
    }
    .share-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-lt); }
  </style>
</head>
<body>

<header>
  <nav class="navbar">
    <a href="/" class="nav-logo">Mero<span>Space</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/rooms">Explore</a></li>
      <li><a href="/add-room">List Your Space</a></li>
      <li id="navAuth"></li>
    </ul>
  </nav>
</header>

<main class="room-detail-page" id="roomDetailPage">
  <nav aria-label="Breadcrumb">
    <ol class="breadcrumb">
      <li><a href="/">Home</a></li>
      <li class="separator">›</li>
      <li><a href="/rooms">Explore</a></li>
      <li class="separator">›</li>
      <li class="current" id="breadcrumbTitle">Room Details</li>
    </ol>
  </nav>

  <div class="spinner-wrap" id="loadingSpinner" aria-label="Loading room details">
    <div class="spinner"></div>
  </div>

  <div id="roomContent" style="display:none;"></div>
</main>

<!-- lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Previous image">‹</button>
  <img id="lightboxImg" src="" alt="Room photo">
  <button class="lightbox-nav next" id="lightboxNext" aria-label="Next image">›</button>
</div>

<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-brand">
      <a href="/" class="nav-logo">Mero<span>Space</span></a>
      <p>Verified rooms and flats in Kathmandu Valley.</p>
    </div>
    <div class="footer-col"><h4>Explore</h4><a href="/rooms">Browse Rooms</a><a href="/add-room">List a Space</a></div>
    <div class="footer-col"><h4>Account</h4><a href="/login">Log In</a><a href="/register">Sign Up</a></div>
    <div class="footer-col"><h4>Company</h4><a href="/about">About</a><a href="/contact">Contact</a></div>
  </div>
  <div class="footer-bottom">
    <span>© 2026 MeroSpace.</span>
    <span><a href="/contact">Privacy</a> · <a href="/contact">Terms</a></span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/script.js"></script>
<script>
(function () {
  const API_BASE = 'http://localhost:5000';
  const API      = API_BASE + '/api';
  const token    = () => localStorage.getItem('msToken') || '';

  const spinner     = document.getElementById('loadingSpinner');
  const content     = document.getElementById('roomContent');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const id = new URLSearchParams(window.location.search).get('id');

  // lightbox state
  let lbImages = []; let lbIndex = 0;
  const openLightbox = (i) => { lbIndex = i; lightboxImg.src = API_BASE + lbImages[i]; lightbox.classList.add('open'); document.body.style.overflow = 'hidden'; };
  const closeLightbox = () => { lightbox.classList.remove('open'); document.body.style.overflow = ''; };
  document.getElementById('lightboxClose')?.addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev')?.addEventListener('click', () => { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; lightboxImg.src = API_BASE + lbImages[lbIndex]; });
  document.getElementById('lightboxNext')?.addEventListener('click', () => { lbIndex = (lbIndex + 1) % lbImages.length; lightboxImg.src = API_BASE + lbImages[lbIndex]; });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft')  document.getElementById('lightboxPrev')?.click();
    if (e.key === 'ArrowRight') document.getElementById('lightboxNext')?.click();
  });
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

  if (!id) {
    spinner.style.display = 'none'; content.style.display = 'block';
    content.innerHTML = notFound(); return;
  }

  fetch(`${API}/rooms/${id}`, { headers: { Authorization: 'Bearer ' + token() } })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(room => {
      spinner.style.display = 'none'; content.style.display = 'block';

      document.title = room.title + ' — MeroSpace';
      const bc = document.getElementById('breadcrumbTitle');
      if (bc) bc.textContent = room.title;

      lbImages = room.images || [];
      const hasImg = lbImages.length > 0;

      // Gallery
      const galleryHTML = hasImg
        ? `<div class="gallery-container">
            <div class="gallery-main" id="galleryMain" style="cursor:zoom-in;" title="Click to enlarge">
              <img src="${API_BASE}${lbImages[0]}" alt="${room.title}" id="galleryMainImg" loading="eager">
            </div>
            <button class="gallery-nav prev" id="galPrev" aria-label="Previous photo">‹</button>
            <button class="gallery-nav next" id="galNext" aria-label="Next photo">›</button>
            ${lbImages.length > 1 ? `<div class="gallery-thumbs" role="list">
              ${lbImages.map((img,i) => `<img src="${API_BASE}${img}" alt="Photo ${i+1}" data-index="${i}" class="${i===0?'active':''}" loading="lazy" role="listitem">`).join('')}
            </div>` : ''}
          </div>`
        : `<div class="gallery-container" style="background:var(--bg-2);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border-radius:var(--r-xl);">
            <div style="text-align:center;color:var(--ink-4)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="64" height="64"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
              <p style="margin-top:8px;font-size:.85rem">No photos available</p>
            </div>
          </div>`;

      // Facilities
      const facs = (room.facilities || []).map(f => `<span class="facility-tag">${f}</span>`).join('');

      // Owner initial
      const ownerInitial = (room.owner?.name || 'O').charAt(0).toUpperCase();

      // Status badge
      const statusBadge = room.status === 'approved'
        ? `<span class="badge badge-success">Verified</span>`
        : `<span class="badge badge-warning">${room.status || 'pending'}</span>`;

      content.innerHTML = `
        <div class="room-detail-grid">
          <!-- LEFT: gallery + info -->
          <div>
            ${galleryHTML}

            <div style="margin-top:var(--sp-6)">
              <div class="detail-section">
                <div class="detail-section-label">About this space</div>
                <p>${room.description || 'No description provided by the owner.'}</p>
              </div>

              ${facs ? `<div class="detail-section">
                <div class="detail-section-label">Facilities & Amenities</div>
                <div class="facility-list">${facs}</div>
              </div>` : ''}

              <div class="detail-section">
                <div class="detail-section-label">Property Details</div>
                <div class="detail-info-grid">
                  <div class="detail-info-item"><div class="label">Type</div><div class="value">${room.roomType || '—'}</div></div>
                  ${room.bedrooms ? `<div class="detail-info-item"><div class="label">Bedrooms</div><div class="value">${room.bedrooms}</div></div>` : ''}
                  ${room.bathrooms ? `<div class="detail-info-item"><div class="label">Bathrooms</div><div class="value">${room.bathrooms}</div></div>` : ''}
                  <div class="detail-info-item"><div class="label">Location</div><div class="value">${room.location}</div></div>
                </div>
              </div>

              <div class="detail-section">
                <div class="detail-section-label">Nearby</div>
                <div class="nearby-list">
                  <span class="nearby-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/></svg>Schools & colleges</span>
                  <span class="nearby-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>Public transport</span>
                  <span class="nearby-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/></svg>Markets</span>
                </div>
              </div>

              <div class="share-row">
                <span>Share:</span>
                <button class="share-btn" onclick="navigator.share ? navigator.share({title:'${room.title}',url:location.href}) : navigator.clipboard.writeText(location.href).then(()=>showToast('Link copied!','success'))">Copy Link</button>
              </div>
            </div>
          </div>

          <!-- RIGHT: sticky detail card -->
          <div>
            <div class="detail-card">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-2)">
                <div class="room-card-type">${room.roomType}</div>
                ${statusBadge}
              </div>
              <h1>${room.title}</h1>

              <div class="detail-price">
                Rs. ${room.price.toLocaleString()}
                <small>/month</small>
              </div>

              <div class="detail-meta">
                <span class="detail-meta-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M12 22s7-6.2 7-12A7 7 0 1 0 5 10c0 5.8 7 12 7 12z"/></svg>
                  ${room.location}
                </span>
                ${room.bedrooms ? `<span class="detail-meta-item">${room.bedrooms} Bed</span>` : ''}
                ${room.bathrooms ? `<span class="detail-meta-item">${room.bathrooms} Bath</span>` : ''}
              </div>

              <!-- Owner / contact -->
              <div class="contact-box">
                <div class="contact-box-owner">
                  <div class="owner-avatar">${ownerInitial}</div>
                  <div class="owner-info">
                    <div class="owner-name">${room.owner?.name || 'Property Owner'}</div>
                    <div class="owner-label">Verified landlord on MeroSpace</div>
                  </div>
                </div>
                ${room.contact
                  ? `<a href="tel:${room.contact}" class="btn btn-primary btn-full">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.18 2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9a16 16 0 0 0 6.29 6.29l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                      Call ${room.contact}
                    </a>`
                  : `<div style="text-align:center;color:var(--ink-3);font-size:.85rem;padding:var(--sp-3)">Contact info hidden</div>`
                }
              </div>

              <button class="fav-btn" id="favBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span id="favLabel">Save this room</span>
              </button>

              <p style="font-size:.72rem;color:var(--ink-4);text-align:center;margin-top:var(--sp-3);">
                🔒 Your contact is private. Landlord cannot see your details until you call.
              </p>
            </div>
          </div>
        </div>`;

      // gallery logic
      if (hasImg && lbImages.length > 0) {
        let gIdx = 0;
        const mainImg  = document.getElementById('galleryMainImg');
        const thumbs   = document.querySelectorAll('.gallery-thumbs img');
        const updateGallery = i => {
          gIdx = i; mainImg.src = API_BASE + lbImages[i];
          thumbs.forEach((t,ti) => t.classList.toggle('active', ti === i));
        };
        thumbs.forEach(t => t.addEventListener('click', () => updateGallery(parseInt(t.dataset.index))));
        document.getElementById('galPrev')?.addEventListener('click', () => updateGallery((gIdx - 1 + lbImages.length) % lbImages.length));
        document.getElementById('galNext')?.addEventListener('click', () => updateGallery((gIdx + 1) % lbImages.length));
        // open lightbox on main image click
        document.getElementById('galleryMain')?.addEventListener('click', () => openLightbox(gIdx));
      }

      // favorite button
      const favBtn   = document.getElementById('favBtn');
      const favLabel = document.getElementById('favLabel');
      if (favBtn) {
        if (!token()) {
          favBtn.addEventListener('click', () => window.location.href = '/login');
        } else {
          fetch(`${API}/favorites/${id}`, { headers: { Authorization: 'Bearer ' + token() } })
            .then(r => r.json()).then(d => {
              if (d.isFavorited) {
                favBtn.classList.add('active'); favBtn.querySelector('svg').setAttribute('fill','currentColor');
                favLabel.textContent = 'Saved ✓';
              }
            }).catch(() => {});

          favBtn.addEventListener('click', async () => {
            const saved = favBtn.classList.contains('active');
            try {
              const res = await fetch(saved ? `${API}/favorites/${id}` : `${API}/favorites`, {
                method: saved ? 'DELETE' : 'POST',
                headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + token() },
                body: saved ? undefined : JSON.stringify({ roomId: id })
              });
              if (res.ok) {
                favBtn.classList.toggle('active', !saved);
                favBtn.querySelector('svg').setAttribute('fill', saved ? 'none' : 'currentColor');
                favLabel.textContent = saved ? 'Save this room' : 'Saved ✓';
                showToast(saved ? 'Removed from saved' : 'Saved!', saved ? '' : 'success');
              }
            } catch { showToast('Error', 'error'); }
          });
        }
      }

      // record view
      fetch(`${API}/rooms/${id}/view`, { method: 'POST' }).catch(() => {});
    })
    .catch(() => {
      spinner.style.display = 'none'; content.style.display = 'block';
      content.innerHTML = notFound();
    });

  function notFound() {
    return `<div style="text-align:center;padding:80px 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-4)" stroke-width="1.2" width="64" height="64" style="margin:0 auto var(--sp-4)"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <h2 style="font-size:1.4rem;margin-bottom:var(--sp-2)">Room not found</h2>
      <p style="color:var(--ink-3);margin-bottom:var(--sp-6)">This listing may have been removed or the link is incorrect.</p>
      <a href="/rooms" class="btn btn-primary">Browse all rooms →</a>
    </div>`;
  }

  // scroll to top
  const scrollBtn = document.getElementById('scrollTop');
  if (scrollBtn) {
    window.addEventListener('scroll', () => scrollBtn.classList.toggle('visible', window.scrollY > 400), { passive: true });
    scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }
})();
</script>
</body>
</html>
